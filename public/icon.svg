<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#020617" stroke="#334155" stroke-width="8"/>
  <!-- 8x8 Grid Blocks Design -->
  <g transform="translate(64, 64)">
    <!-- Blue Big Block -->
    <rect x="16" y="16" width="168" height="168" rx="28" fill="#3b82f6" stroke="#60a5fa" stroke-width="6"/>
    <!-- Yellow Horizontal Block -->
    <rect x="200" y="16" width="168" height="80" rx="20" fill="#facc15" stroke="#fde047" stroke-width="6"/>
    <!-- Red Block -->
    <rect x="200" y="112" width="80" height="168" rx="20" fill="#f43f5e" stroke="#fb7185" stroke-width="6"/>
    <!-- Slate Block -->
    <rect x="296" y="112" width="72" height="72" rx="16" fill="#cbd5e1" stroke="#f1f5f9" stroke-width="6"/>
    <!-- Black Fixed Block -->
    <rect x="16" y="200" width="168" height="80" rx="20" fill="#090d16" stroke="#475569" stroke-width="6"/>
    <!-- Emerald Block -->
    <rect x="296" y="200" width="72" height="168" rx="20" fill="#10b981" stroke="#34d399" stroke-width="6"/>
    <!-- Purple Block -->
    <rect x="16" y="296" width="264" height="72" rx="20" fill="#a855f7" stroke="#c084fc" stroke-width="6"/>
  </g>
  <!-- Sparkle Accent -->
  <path d="M416 80 L424 104 L448 112 L424 120 L416 144 L408 120 L384 112 L408 104 Z" fill="#facc15"/>
</svg>
